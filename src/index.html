<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0ede8;
            font-family: 'DM Sans', sans-serif;
        }

        .calculadora {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }

        h1 {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #aaa;
        }

        #expresion {
            width: 100%;
            background: #f7f5f2;
            border: 2px solid #e8e4de;
            border-radius: 12px;
            padding: 14px 16px;
            font-family: monospace;
            font-size: 22px;
            text-align: right;
            color: #222;
            outline: none;
        }

        #resultado {
            text-align: right;
            font-size: 28px;
            font-weight: 600;
            color: #3d3530;
            min-height: 36px;
            padding: 0 4px;
        }

        #mensaje-error {
            text-align: center;
            font-size: 12px;
            color: #c0392b;
            min-height: 18px;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-family: monospace;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
        }

        button:active { transform: scale(0.94); }

        .btn-numero { background: #f0ede8; color: #333; }
        .btn-numero:hover { background: #e5e1db; }

        .btn-operador { background: #e8dfd3; color: #7a5c3a; }
        .btn-operador:hover { background: #ddd3c5; }

        .btn-igual {
            background: #3d3530;
            color: #fff;
            grid-column: span 2;
        }
        .btn-igual:hover { background: #2a2320; }

        .btn-borrar { background: #fdecea; color: #c0392b; }
        .btn-borrar:hover { background: #f5c6c2; }
    </style>
</head>
<body>
    <div class="calculadora">
        <h1>Calculadora</h1>
        <input type="text" id="expresion" placeholder="0" readonly>
        <div id="resultado"></div>
        <p id="mensaje-error"></p>
        <div class="botones">
            <button class="btn-numero" data-testid="btn-7" onclick="agregarDigito('7')">7</button>
            <button class="btn-numero" data-testid="btn-8" onclick="agregarDigito('8')">8</button>
            <button class="btn-numero" data-testid="btn-9" onclick="agregarDigito('9')">9</button>
            <button class="btn-numero" data-testid="btn-4" onclick="agregarDigito('4')">4</button>
            <button class="btn-numero" data-testid="btn-5" onclick="agregarDigito('5')">5</button>
            <button class="btn-numero" data-testid="btn-6" onclick="agregarDigito('6')">6</button>
            <button class="btn-numero" data-testid="btn-1" onclick="agregarDigito('1')">1</button>
            <button class="btn-numero" data-testid="btn-2" onclick="agregarDigito('2')">2</button>
            <button class="btn-numero" data-testid="btn-3" onclick="agregarDigito('3')">3</button>
            <button class="btn-numero" data-testid="btn-0" onclick="agregarDigito('0')">0</button>
            <button class="btn-operador" data-testid="btn-mas" onclick="agregarSuma()">+</button>
            <button class="btn-borrar" data-testid="btn-borrar" onclick="borrar()">C</button>
            <button class="btn-igual" data-testid="btn-igual" onclick="calcular()">=</button>
        </div>
    </div>

    <script>
        const urlCalcular = "http://127.0.0.1:8000/sumar";

        function agregarDigito(digito) {
            limpiarError();
            document.getElementById('expresion').value += digito;
        }

        function agregarSuma() {
            limpiarError();
            const exp = document.getElementById('expresion').value;
            if (exp === '') return;
            if (exp.trim().endsWith('+')) return;
            document.getElementById('expresion').value += ' + ';
        }

        function borrar() {
            document.getElementById('expresion').value = '';
            document.getElementById('resultado').textContent = '';
            limpiarError();
        }

        function limpiarError() {
            document.getElementById('mensaje-error').textContent = '';
        }

        async function calcular() {
            const expresion = document.getElementById('expresion').value;
            if (!expresion) {
                document.getElementById('mensaje-error').textContent = 'Escribe una expresión primero.';
                return;
            }
            try {
                const respuesta = await fetch(urlCalcular, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dato: expresion })
                });
                const datos = await respuesta.json();
                if (!respuesta.ok) {
                    document.getElementById('mensaje-error').textContent = datos.detail || 'Error en el cálculo.';
                    document.getElementById('resultado').textContent = '';
                } else {
                    document.getElementById('resultado').textContent = datos.resultado;
                    limpiarError();
                }
            } catch (e) {
                document.getElementById('mensaje-error').textContent = 'No se pudo conectar con el servidor.';
            }
        }
    </script>
</body>
</html>
